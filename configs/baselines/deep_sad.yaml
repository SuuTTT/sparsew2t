# Deep SAD (Ruff et al., ICLR 2020), the DeLise (2023) setting: anchors + confident normals on the latent hypersphere,
# scored by ||z - c||^2 (NOT by the untrained score head). No pseudo-labels, no trade gradient; traded by the shared rule.
_base_: ../default.yaml
experiment: {name: baseline_deep_sad}
semi: {use_label_model: false, use_conformal: false, use_consistency: false, use_ssl: true, ssl_in_semi: false, use_outcome_weights: false, use_trade_loss: false}
loss: {lam_sad: 1.0, lam_dev: 0.0}
eval: {score: svdd, policy: false}
model: {ablation: {two_stage: true}}
